<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parete — prova</title>
    <link rel="stylesheet" href="css/parete.css" />
  </head>

  <body>
    <main class="parete">
      <div class="parete__stage">
        <!-- muro vuoto (sfondo) + i pezzi incastrati sopra, posizioni in % dalla mappa -->
        <div class="wall" id="wall">
          <img
            class="wall__bg"
            src="assets/img/parete/sfondo.png"
            alt="Parete dei lavori — SAVE Tattoo"
          />

          <div class="piece" style="left: 2.5%; top: 12%; width: 16.5%">
            <img src="assets/img/parete/02.png" alt="SAVE Tattoo — contatti" />
          </div>
          <div class="piece" style="left: 20.3%; top: 16.5%; width: 6.3%">
            <img src="assets/img/parete/03.png" alt="Disegno" />
          </div>
          <div class="piece" style="left: 5.5%; top: 30%; width: 7.5%">
            <img src="assets/img/parete/04.png" alt="No War" />
          </div>
          <div class="piece" style="left: 14.5%; top: 33%; width: 7%">
            <img src="assets/img/parete/05.png" alt="Suca" />
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
